<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My orders — Bubble Pod</title>
  <link rel="stylesheet" href="/static/order.css" />
</head>
<body data-page="my-orders">
  <header class="chrome">
    <a class="brand" href="/">
      <span class="mark">BP</span>
      <div><strong>Bubble Pod</strong><small>Stickman Automation</small></div>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/">Studio</a>
      <details class="nav-menu is-current">
        <summary>Orders</summary>
        <div class="nav-submenu">
          <a href="/order">Order videos</a>
          <a href="/my-orders" aria-current="page">My orders</a>
          <a href="/production" id="production-nav" hidden>Production</a>
        </div>
      </details>
    </nav>
  </header>
  <main>
    <h1>My orders</h1>
    <p class="lede">Enter the email you used at checkout. You only see orders for that address.</p>
    <form id="lookup" class="card stack">
      <label for="lookup-email">Checkout email
        <input id="lookup-email" name="email" type="email" autocomplete="email" required />
      </label>
      <p id="lookup-error" class="error" hidden></p>
      <button type="submit" class="primary">Show my orders</button>
    </form>
    <div id="results" class="stack" style="margin-top:16px"></div>
  </main>
  <script src="/static/order.js"></script>
</body>
</html>
