# Production stack for Hostinger VPS (or any Docker host)
services:
  studio:
    build: .
    image: bubblepod-studio:latest
    restart: unless-stopped
    ports:
      - "7878:7878"
    env_file:
      - .env.production
    environment:
      BUBBLEPOD_HOST: "0.0.0.0"
      BUBBLEPOD_PORT: "7878"
      BUBBLEPOD_COOKIE_SECURE: "1"
    volumes:
      - bubblepod_data:/app/user_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Gentle phoneme aligner (lip-sync). Comment out if you use an external Gentle URL.
  gentle:
    image: lowerquality/gentle:latest
    restart: unless-stopped
    ports:
      - "8766:8765"

volumes:
  bubblepod_data:
